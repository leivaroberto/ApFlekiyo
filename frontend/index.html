<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppFlekiyo - Tablero de Control</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <h1>AppFlekiyo</h1>
        <p>Tablero de Control - Recepción</p>
    </header>

   <div class="contenedor-principal">
        <!-- Columna Izquierda: Controles -->
        <div class="columna-izquierda">
            <aside class="panel-control">
                <h3>Agendar Nuevo Turno</h3>
                <input type="text" id="input-cliente" placeholder="Nombre del Cliente (Ej. María)">
            <select id="select-peluquero">
                <option value="1">Peluquero 1</option>
                <option value="2">Peluquero 2</option>
            </select>
            <button onclick="crearTurnoNuevo()" class="btn-agendar">Guardar Turno</button>
        </aside>
        <!-- NUEVO: Panel del Pañol -->
            <aside class="panel-panol" style="margin-top: 20px;">
                <h3>📦 Pañol (Stock)</h3>
                <div id="lista-insumos">
                    <p>Cargando stock...</p>
                </div>
            </aside>
        <!-- Calendario visual -->
        <main class="calendario-container">
            <h2>Turnos de Hoy</h2>
            <div id="lista-turnos" class="grilla-turnos">
                <p>Cargando turnos...</p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
